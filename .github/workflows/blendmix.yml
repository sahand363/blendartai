name: blendmix

on:
  push:
    tags:
      - "blendmix-v*"
  pull_request:
    paths:
      - "blendmix/**"
      - ".github/workflows/blendmix.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blendmix
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: blendmix/go.mod
          cache-dependency-path: blendmix/go.sum

      - name: Test
        run: go test -race ./...

      - name: Build static linux/amd64 binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o blendmix ./cmd/blendmix

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/blendmix-v')
        uses: softprops/action-gh-release@v2
        with:
          files: blendmix/blendmix


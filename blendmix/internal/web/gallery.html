<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>blendmix</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a2f3a;
      --text: #e6e9ef;
      --muted: #9aa3b2;
      --accent: #4c8bf5;
      --good: #2ecc71;
      --bad: #e74c3c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    button, select {
      background: #222733;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
    .status { font-size: 13px; color: var(--muted); }
    main { padding: 16px; max-width: 1400px; margin: 0 auto; }
    .pair { margin-bottom: 28px; }
    .pair h3 {
      margin: 0 0 10px;
      font-size: 14px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }
    .card {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 1 / 1;
    }
    .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card .prompt {
      position: absolute;
      inset: auto 0 0 0;
      background: rgba(10, 12, 16, 0.88);
      padding: 8px;
      font-size: 12px;
      line-height: 1.35;
      max-height: 60%;
      overflow-y: auto;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    .card:hover .prompt { opacity: 1; }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal.open { display: flex; }
    .modal img { max-width: 90vw; max-height: 75vh; border-radius: 8px; }
    .modal-caption {
      max-width: 900px;
      margin-top: 12px;
      font-size: 14px;
      color: var(--text);
      text-align: center;
    }
    .modal-actions { margin-top: 12px; display: flex; gap: 10px; }
  </style>
</head>
<body>
  <header>
    <div class="row">
      <strong>blendmix</strong>
      <select id="runSelect"></select>
      <button id="refreshBtn">Refresh</button>
      <button id="startBtn" class="primary">Start Run</button>
      <button id="stopBtn" class="danger">Stop</button>
      <button id="tokenBtn">Token</button>
    </div>
    <div id="statusBar" class="status">Loading status...</div>
  </header>

  <main id="gallery"></main>

  <div id="modal" class="modal">
    <img id="modalImg" alt="" />
    <div id="modalCaption" class="modal-caption"></div>
    <div class="modal-actions">
      <button id="keepBtn" class="primary">Keep (K)</button>
      <button id="rejectBtn" class="danger">Reject (X)</button>
      <button id="prevBtn">Prev (←)</button>
      <button id="nextBtn">Next (→)</button>
      <button id="closeBtn">Close (Esc)</button>
    </div>
  </div>

  <script>
    const BASE = "__BASE_PATH__";
    const apiUrl = (p) => (BASE ? BASE : "") + p;

    let token = localStorage.getItem("blendmix_token") || "";
    function ensureToken(force = false) {
      if (!token || force) {
        const entered = prompt("Enter BLENDMIX_TOKEN:", token);
        if (entered !== null) {
          token = entered.trim();
          localStorage.setItem("blendmix_token", token);
        }
      }
      return token;
    }

    async function apiFetch(path, opts = {}) {
      ensureToken();
      const headers = Object.assign({}, opts.headers || {}, {
        "Authorization": "Bearer " + token
      });
      const res = await fetch(apiUrl(path), Object.assign({}, opts, { headers }));
      if (res.status === 401) {
        ensureToken(true);
        throw new Error("Unauthorized");
      }
      return res;
    }

    let runs = [];
    let flatImages = [];
    let currentIdx = -1;
    const blobCache = new Map();

    async function loadImageURL(runID, path) {
      const key = runID + "::" + path;
      if (blobCache.has(key)) return blobCache.get(key);
      const q = new URLSearchParams({ run: runID, path });
      const res = await apiFetch("/api/image?" + q.toString());
      if (!res.ok) return "";
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      blobCache.set(key, url);
      return url;
    }

    async function pollStatus() {
      try {
        const res = await apiFetch("/api/status");
        const st = await res.json();
        const parts = [
          `State: ${st.status}`,
          `Images: ${st.images_done}`,
          `Spend: $${(st.est_spend_usd || 0).toFixed(4)}`
        ];
        if (st.current_pair) parts.push(`Pair: ${st.current_pair}`);
        if (st.stop_reason) parts.push(`Stop: ${st.stop_reason}`);
        if (st.last_error) parts.push(`Err: ${st.last_error}`);
        document.getElementById("statusBar").textContent = parts.join(" | ");
      } catch (e) {
        document.getElementById("statusBar").textContent = "Status error: " + e.message;
      }
    }

    async function loadRuns() {
      const res = await apiFetch("/api/runs");
      const data = await res.json();
      runs = data.runs || [];
      const sel = document.getElementById("runSelect");
      const prev = sel.value;
      sel.innerHTML = "";
      for (const r of runs) {
        const opt = document.createElement("option");
        opt.value = r.run_id;
        opt.textContent = `${r.run_id} (${r.state.images_done || 0} imgs)`;
        sel.appendChild(opt);
      }
      if (prev && runs.some(r => r.run_id === prev)) sel.value = prev;
      renderRun();
    }

    async function renderRun() {
      const runID = document.getElementById("runSelect").value;
      const run = runs.find(r => r.run_id === runID);
      const container = document.getElementById("gallery");
      container.innerHTML = "";
      flatImages = [];
      if (!run || !run.pairs || run.pairs.length === 0) {
        container.textContent = "No images in this run yet.";
        return;
      }
      for (const pair of run.pairs) {
        const sec = document.createElement("section");
        sec.className = "pair";
        const h = document.createElement("h3");
        h.textContent = pair.name;
        sec.appendChild(h);

        const grid = document.createElement("div");
        grid.className = "grid";
        for (const img of pair.images) {
          const idx = flatImages.length;
          flatImages.push({ runID, path: img.path, prompt: img.prompt || "" });

          const card = document.createElement("div");
          card.className = "card";
          card.onclick = () => openModal(idx);

          const el = document.createElement("img");
          el.alt = img.name;
          loadImageURL(runID, img.path).then(u => { if (u) el.src = u; });

          const cap = document.createElement("div");
          cap.className = "prompt";
          cap.textContent = img.prompt || "(no prompt)";

          card.appendChild(el);
          card.appendChild(cap);
          grid.appendChild(card);
        }
        sec.appendChild(grid);
        container.appendChild(sec);
      }
    }

    async function openModal(idx) {
      if (idx < 0 || idx >= flatImages.length) return;
      currentIdx = idx;
      const item = flatImages[idx];
      document.getElementById("modalImg").src = await loadImageURL(item.runID, item.path);
      document.getElementById("modalCaption").textContent = item.prompt;
      document.getElementById("modal").classList.add("open");
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("open");
      currentIdx = -1;
    }

    async function pickCurrent() {
      if (currentIdx < 0) return;
      const item = flatImages[currentIdx];
      await apiFetch("/api/pick", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ run: item.runID, path: item.path })
      });
      if (currentIdx + 1 < flatImages.length) openModal(currentIdx + 1);
    }

    async function rejectCurrent() {
      if (currentIdx < 0) return;
      const item = flatImages[currentIdx];
      await apiFetch("/api/reject", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ run: item.runID, path: item.path })
      });
      closeModal();
      await loadRuns();
    }

    document.getElementById("runSelect").onchange = renderRun;
    document.getElementById("refreshBtn").onclick = loadRuns;
    document.getElementById("tokenBtn").onclick = () => { ensureToken(true); loadRuns(); pollStatus(); };
    document.getElementById("startBtn").onclick = async () => {
      await apiFetch("/api/run", { method: "POST" });
      pollStatus();
    };
    document.getElementById("stopBtn").onclick = async () => {
      await apiFetch("/api/stop", { method: "POST" });
      pollStatus();
    };
    document.getElementById("keepBtn").onclick = pickCurrent;
    document.getElementById("rejectBtn").onclick = rejectCurrent;
    document.getElementById("prevBtn").onclick = () => openModal(currentIdx - 1);
    document.getElementById("nextBtn").onclick = () => openModal(currentIdx + 1);
    document.getElementById("closeBtn").onclick = closeModal;

    document.addEventListener("keydown", (e) => {
      if (currentIdx < 0) return;
      if (e.key === "Escape") closeModal();
      else if (e.key === "ArrowRight") openModal(currentIdx + 1);
      else if (e.key === "ArrowLeft") openModal(currentIdx - 1);
      else if (e.key === "k" || e.key === "K") pickCurrent();
      else if (e.key === "x" || e.key === "X") rejectCurrent();
    });

    ensureToken();
    pollStatus();
    loadRuns();
    setInterval(pollStatus, 3000);
  </script>
</body>
</html>
